kind = "mobile"
previewPath = "/"
title = "TaxiAnalysis - Kurs Opłacalności"
version = "1.0.0"
id = "artifacts/taxianalysis"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
localPort = 22783
name = "expo"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/taxianalysis run dev"

[services.env]
PORT = "22783"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/taxianalysis", "run", "build"]
run = ["pnpm", "--filter", "@workspace/taxianalysis", "run", "serve"]
